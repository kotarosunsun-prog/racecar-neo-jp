<svg xmlns="http://www.w3.org/2000/svg" width="940" height="260" viewBox="0 0 940 260" font-family="Noto Sans CJK JP, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
  <style>.n{font-size:13px;fill:#868E96;font-weight:700}.b{font-size:16px;font-weight:700;fill:#212529}.s{font-size:12.5px;fill:#495057}.ln{stroke:#495057;stroke-width:2.2}</style></defs>
  <rect width="940" height="260" fill="#FFFFFF"/>
  <g>
    <rect x="16" y="30" width="200" height="180" rx="14" fill="#E7F5FF" stroke="#74C0FC" stroke-width="2"/>
    <text x="32" y="56" class="n">1</text><text x="116" y="82" class="b" text-anchor="middle">プロジェクトを作る</text>
    <text x="32" y="116" class="s">・Create Project</text><text x="32" y="140" class="s">・Data Import で</text><text x="46" y="160" class="s">写真を読みこむ</text>
    <rect x="248" y="30" width="200" height="180" rx="14" fill="#FFF4E6" stroke="#FFC078" stroke-width="2"/>
    <text x="264" y="56" class="n">2</text><text x="348" y="82" class="b" text-anchor="middle">ラベルを決める</text>
    <text x="264" y="116" class="s">・Labeling Setup</text><text x="264" y="140" class="s">・Object Detection with</text><text x="278" y="160" class="s">Bounding Boxes</text><text x="264" y="184" class="s">・名前（例：cone）を登録</text>
    <rect x="480" y="30" width="200" height="180" rx="14" fill="#EBFBEE" stroke="#8CE99A" stroke-width="2"/>
    <text x="496" y="56" class="n">3</text><text x="580" y="82" class="b" text-anchor="middle">枠を描く</text>
    <text x="496" y="116" class="s">・名前を選ぶ</text><text x="496" y="140" class="s">・物をドラッグで囲む</text><text x="496" y="164" class="s">・Submit で次の写真へ</text>
    <rect x="712" y="30" width="212" height="180" rx="14" fill="#F3F0FF" stroke="#B197FC" stroke-width="2"/>
    <text x="728" y="56" class="n">4</text><text x="818" y="82" class="b" text-anchor="middle">書き出す</text>
    <text x="728" y="116" class="s">・Export → Pascal VOC XML</text><text x="728" y="140" class="s">・ZIP の中に</text><text x="742" y="160" class="s">images/（写真）と</text><text x="742" y="180" class="s">Annotations/（XML）</text>
    <line x1="218" y1="120" x2="244" y2="120" class="ln" marker-end="url(#ar)"/>
    <line x1="450" y1="120" x2="476" y2="120" class="ln" marker-end="url(#ar)"/>
    <line x1="682" y1="120" x2="708" y2="120" class="ln" marker-end="url(#ar)"/>
  </g>
  <text x="16" y="244" class="s">3 の作業を、すべての写真について行う。1枚の写真に物がいくつあっても、全部に枠を付ける。</text>
</svg>
