<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>.b{font-size:17px;font-weight:700;fill:#212529}.s{font-size:14px;fill:#495057}.m{font-size:16px;font-family:"DejaVu Sans Mono",monospace;fill:#212529}.w{font-size:15px;font-family:"DejaVu Sans Mono",monospace;fill:#E8590C;font-weight:700}.ln{stroke:#495057;stroke-width:2.2;fill:none}</style>
  </defs>
  <rect width="920" height="330" fill="#FFFFFF"/>
  <text x="30" y="36" class="b">1つのニューロン：入力に重みをかけて足し、関数に通す</text>
  <!-- inputs -->
  <circle cx="90" cy="110" r="30" fill="#E7F5FF" stroke="#74C0FC" stroke-width="2"/><text x="90" y="116" class="m" text-anchor="middle">x₁</text>
  <circle cx="90" cy="200" r="30" fill="#E7F5FF" stroke="#74C0FC" stroke-width="2"/><text x="90" y="206" class="m" text-anchor="middle">x₂</text>
  <circle cx="90" cy="280" r="22" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="2"/><text x="90" y="286" class="m" text-anchor="middle">1</text>
  <text x="30" y="72" class="s">入力</text>
  <line x1="120" y1="112" x2="332" y2="182" class="ln" marker-end="url(#ar)"/>
  <line x1="120" y1="200" x2="330" y2="200" class="ln" marker-end="url(#ar)"/>
  <line x1="112" y1="276" x2="334" y2="216" class="ln" marker-end="url(#ar)"/>
  <text x="200" y="128" class="w">× w₁</text>
  <text x="206" y="192" class="w">× w₂</text>
  <text x="200" y="266" class="w">× b</text>
  <!-- sum -->
  <circle cx="370" cy="200" r="36" fill="#FFF4E6" stroke="#FFC078" stroke-width="2.5"/><text x="370" y="211" font-size="30" text-anchor="middle" fill="#D9480F">Σ</text>
  <text x="330" y="262" class="s">足し合わせる</text>
  <text x="300" y="302" class="m">z = w₁x₁ + w₂x₂ + b</text>
  <line x1="406" y1="200" x2="520" y2="200" class="ln" marker-end="url(#ar)"/>
  <text x="452" y="190" class="m">z</text>
  <!-- activation -->
  <rect x="524" y="160" width="130" height="80" rx="14" fill="#EBFBEE" stroke="#8CE99A" stroke-width="2.5"/>
  <path d="M540 225 L 580 225 L 580 178 L 640 178" stroke="#2F9E44" stroke-width="3" fill="none"/>
  <text x="589" y="270" class="s" text-anchor="middle">活性化関数 f</text>
  <line x1="654" y1="200" x2="760" y2="200" class="ln" marker-end="url(#ar)"/>
  <circle cx="800" cy="200" r="34" fill="#F3F0FF" stroke="#B197FC" stroke-width="2"/><text x="800" y="206" class="m" text-anchor="middle">a</text>
  <text x="768" y="262" class="s">出力 a = f(z)</text>
  <text x="560" y="72" class="s">w（重み）と b（バイアス）が、</text>
  <text x="560" y="96" class="s">学習で決めるパラメータ</text>
</svg>
