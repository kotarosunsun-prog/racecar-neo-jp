<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>.b{font-size:17px;font-weight:700;fill:#212529}.s{font-size:14px;fill:#495057}.m{font-size:16px;font-family:"DejaVu Sans Mono",monospace;fill:#212529}.w{font-size:15px;font-family:"DejaVu Sans Mono",monospace;fill:#E8590C;font-weight:700}.ln{stroke:#495057;stroke-width:2.2;fill:none}</style>
  </defs>
  <rect width="920" height="350" fill="#FFFFFF"/>
  <text x="120" y="34" class="b" text-anchor="middle">入力層</text>
  <text x="430" y="34" class="b" text-anchor="middle">かくれ層（2つ）</text>
  <text x="760" y="34" class="b" text-anchor="middle">出力層</text>
  <circle cx="120" cy="175" r="34" fill="#E7F5FF" stroke="#74C0FC" stroke-width="2"/><text x="120" y="182" class="m" text-anchor="middle">H</text>
  <circle cx="430" cy="100" r="38" fill="#FFF4E6" stroke="#FFC078" stroke-width="2.5"/><text x="430" y="107" class="m" text-anchor="middle">n1</text>
  <circle cx="430" cy="250" r="38" fill="#FFF4E6" stroke="#FFC078" stroke-width="2.5"/><text x="430" y="257" class="m" text-anchor="middle">n2</text>
  <circle cx="760" cy="175" r="40" fill="#FFF5F5" stroke="#FF8787" stroke-width="2.5"/><text x="760" y="182" class="m" text-anchor="middle">赤？</text>
  <line x1="152" y1="162" x2="390" y2="106" class="ln" marker-end="url(#ar)"/>
  <line x1="152" y1="188" x2="390" y2="244" class="ln" marker-end="url(#ar)"/>
  <line x1="468" y1="108" x2="720" y2="166" class="ln" marker-end="url(#ar)"/>
  <line x1="468" y1="242" x2="720" y2="184" class="ln" marker-end="url(#ar)"/>
  <text x="240" y="118" class="w">× (−1)</text>
  <text x="248" y="240" class="w">× 1</text>
  <text x="580" y="118" class="w">× 1</text>
  <text x="580" y="242" class="w">× 1</text>
  <text x="378" y="160" class="s">b = 10</text>
  <text x="372" y="202" class="s">b = −170</text>
  <text x="716" y="240" class="s">b = −0.5</text>
  <text x="480" y="82" class="s">H &lt; 10 なら 1</text>
  <text x="480" y="300" class="s">H &gt; 170 なら 1</text>
  <text x="690" y="104" class="s">どちらかが 1 なら 1</text>
  <text x="40" y="336" class="s">活性化関数はどれもステップ関数（0 より大きければ 1）</text>
</svg>
