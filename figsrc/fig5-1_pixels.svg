<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <style>.s{font-size:15px;fill:#212529}.n{font-size:13px;fill:#495057}.c{font-size:14px;font-family:"DejaVu Sans Mono",monospace;fill:#212529}.b{font-size:17px;font-weight:700;fill:#212529}</style>
  </defs>
  <rect width="920" height="400" fill="#FFFFFF"/>
  <!-- whole image -->
  <text x="40" y="34" class="b">カメラ画像（横 640 × 縦 480）</text>
  <rect x="60" y="70" width="320" height="240" fill="#DEE2E6" stroke="#495057" stroke-width="2"/>
  <rect x="150" y="150" width="60" height="64" fill="#2878CD"/>
  <rect x="236" y="176" width="40" height="44" fill="#F07820"/>
  <circle cx="60" cy="70" r="5" fill="#E8590C"/>
  <text x="18" y="62" class="c" fill="#E8590C">(0, 0)</text>
  <line x1="60" y1="330" x2="380" y2="330" stroke="#495057" stroke-width="2" marker-end="url(#ar)"/>
  <text x="140" y="354" class="s">列（column）：0 〜 639</text>
  <line x1="40" y1="70" x2="40" y2="310" stroke="#495057" stroke-width="2" marker-end="url(#ar)"/>
  <text x="30" y="200" class="s" transform="rotate(-90 30 200)" text-anchor="middle">行（row）：0 〜 479</text>
  <rect x="172" y="170" width="16" height="16" fill="none" stroke="#E8590C" stroke-width="2.5"/>
  <line x1="188" y1="170" x2="470" y2="92" stroke="#E8590C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="188" y1="186" x2="470" y2="300" stroke="#E8590C" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- zoom -->
  <text x="470" y="34" class="b">拡大すると、小さな四角（画素）の集まり</text>
  <g stroke="#FFFFFF" stroke-width="2">
    <rect x="470" y="92" width="52" height="52" fill="#2A7ACF"/><rect x="522" y="92" width="52" height="52" fill="#2878CD"/><rect x="574" y="92" width="52" height="52" fill="#2779CC"/><rect x="626" y="92" width="52" height="52" fill="#2978CE"/>
    <rect x="470" y="144" width="52" height="52" fill="#2878CD"/><rect x="522" y="144" width="52" height="52" fill="#2878CD" stroke="#E8590C" stroke-width="4"/><rect x="574" y="144" width="52" height="52" fill="#2A79CD"/><rect x="626" y="144" width="52" height="52" fill="#2878CC"/>
    <rect x="470" y="196" width="52" height="52" fill="#2779CD"/><rect x="522" y="196" width="52" height="52" fill="#2978CF"/><rect x="574" y="196" width="52" height="52" fill="#2878CD"/><rect x="626" y="196" width="52" height="52" fill="#2A78CD"/>
    <rect x="470" y="248" width="52" height="52" fill="#2878CD"/><rect x="522" y="248" width="52" height="52" fill="#2879CE"/><rect x="574" y="248" width="52" height="52" fill="#2778CC"/><rect x="626" y="248" width="52" height="52" fill="#2878CD"/>
  </g>
  <line x1="548" y1="170" x2="706" y2="170" stroke="#E8590C" stroke-width="2" marker-end="url(#ar)"/>
  <text x="712" y="150" class="c">image[170][181]</text>
  <text x="712" y="176" class="c">= [205, 120, 40]</text>
  <text x="712" y="204" class="n">青 B・緑 G・赤 R の順</text>
  <text x="712" y="226" class="n">それぞれ 0〜255</text>
  <text x="470" y="336" class="s">image.shape は (480, 640, 3)：行の数・列の数・色の数</text>
  <text x="470" y="362" class="n">位置は (行, 列) の順で書く。x・y の順ではないことに注意</text>
</svg>
