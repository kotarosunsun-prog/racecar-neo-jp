<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="aw1" viewBox="0 0 10 10" refX="2" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1C7ED6"/></marker>
<marker id="aw2" viewBox="0 0 10 10" refX="2" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1C7ED6"/></marker>
<marker id="aw3" viewBox="0 0 10 10" refX="2" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1C7ED6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/>
    </marker>
    <!-- one panel: tank + pipe with a constriction; parameters set per panel via clip of water height -->
    <symbol id="tank" overflow="visible">
      <path d="M30 60 V340 H110 V60" fill="none" stroke="#212529" stroke-width="4"/>
    </symbol>
  </defs>
  <rect width="1080" height="470" fill="#FFFFFF"/>

  <!-- ================= Panel A : baseline ================= -->
  <g transform="translate(20,0)">
    <text x="170" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#212529">① 基準</text>
    <rect x="32" y="220" width="76" height="120" fill="#A5D8FF"/>
    <use href="#tank"/>
    <!-- pipe -->
    <path d="M110 310 H170 V318 H220 V310 H300" fill="none" stroke="#212529" stroke-width="4"/>
    <path d="M110 340 H170 V332 H220 V340 H300" fill="none" stroke="#212529" stroke-width="4"/>
    <rect x="110" y="312" width="190" height="26" fill="#A5D8FF" opacity="0.6"/>
    <rect x="170" y="320" width="50" height="10" fill="#A5D8FF"/>
    <rect x="171" y="312" width="48" height="6" fill="#FFFFFF"/>
    <rect x="171" y="332" width="48" height="6" fill="#FFFFFF"/>
    <!-- flow arrows -->
    <line x1="232" y1="325" x2="276" y2="325" stroke="#1C7ED6" stroke-width="7" marker-end="url(#aw1)"/>
    <!-- height marker -->
    <line x1="14" y1="222" x2="14" y2="338" stroke="#D9480F" stroke-width="3" marker-start="url(#ao)" marker-end="url(#ao)"/>
    <text x="-6" y="366" font-size="14" fill="#D9480F">水位差</text>
    <line x1="110" y1="352" x2="310" y2="352" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="195" y="372" font-size="13" fill="#868E96" text-anchor="middle">基準の高さ（0 V）</text>
    <!-- labels -->
    <text x="195" y="300" font-size="14" fill="#495057" text-anchor="middle">細い部分＝抵抗</text>
    <text x="170" y="412" font-size="17" fill="#212529" text-anchor="middle">電圧 1・抵抗 1</text>
    <text x="170" y="440" font-size="17" fill="#1C7ED6" text-anchor="middle" font-weight="700">→ 電流 1</text>
  </g>

  <line x1="360" y1="60" x2="360" y2="450" stroke="#E9ECEF" stroke-width="2"/>

  <!-- ================= Panel B : double the head ================= -->
  <g transform="translate(380,0)">
    <text x="170" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#212529">② 水位を2倍にする</text>
    <rect x="32" y="100" width="76" height="240" fill="#A5D8FF"/>
    <use href="#tank"/>
    <path d="M110 310 H170 V318 H220 V310 H300" fill="none" stroke="#212529" stroke-width="4"/>
    <path d="M110 340 H170 V332 H220 V340 H300" fill="none" stroke="#212529" stroke-width="4"/>
    <rect x="110" y="312" width="190" height="26" fill="#A5D8FF" opacity="0.6"/>
    <rect x="170" y="320" width="50" height="10" fill="#A5D8FF"/>
    <rect x="171" y="312" width="48" height="6" fill="#FFFFFF"/>
    <rect x="171" y="332" width="48" height="6" fill="#FFFFFF"/>
    <line x1="232" y1="325" x2="270" y2="325" stroke="#1C7ED6" stroke-width="15" marker-end="url(#aw2)"/>
    <line x1="14" y1="102" x2="14" y2="338" stroke="#D9480F" stroke-width="3" marker-start="url(#ao)" marker-end="url(#ao)"/>
    <text x="-6" y="366" font-size="14" fill="#D9480F">水位差 2倍</text>
    <line x1="110" y1="352" x2="310" y2="352" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="170" y="412" font-size="17" fill="#212529" text-anchor="middle">電圧 2・抵抗 1</text>
    <text x="170" y="440" font-size="17" fill="#1C7ED6" text-anchor="middle" font-weight="700">→ 電流 2（2倍）</text>
  </g>

  <line x1="720" y1="60" x2="720" y2="450" stroke="#E9ECEF" stroke-width="2"/>

  <!-- ================= Panel C : narrower pipe ================= -->
  <g transform="translate(740,0)">
    <text x="170" y="36" font-size="22" font-weight="700" text-anchor="middle" fill="#212529">③ 管をもっと細くする</text>
    <rect x="32" y="220" width="76" height="120" fill="#A5D8FF"/>
    <use href="#tank"/>
    <path d="M110 310 H150 V321 H240 V310 H300" fill="none" stroke="#212529" stroke-width="4"/>
    <path d="M110 340 H150 V329 H240 V340 H300" fill="none" stroke="#212529" stroke-width="4"/>
    <rect x="110" y="312" width="190" height="26" fill="#A5D8FF" opacity="0.6"/>
    <rect x="150" y="323" width="90" height="4" fill="#A5D8FF"/>
    <rect x="151" y="312" width="88" height="9" fill="#FFFFFF"/>
    <rect x="151" y="329" width="88" height="9" fill="#FFFFFF"/>
    <line x1="252" y1="325" x2="284" y2="325" stroke="#1C7ED6" stroke-width="3" marker-end="url(#aw3)"/>
    <line x1="14" y1="222" x2="14" y2="338" stroke="#D9480F" stroke-width="3" marker-start="url(#ao)" marker-end="url(#ao)"/>
    <text x="-6" y="366" font-size="14" fill="#D9480F">水位差</text>
    <line x1="110" y1="352" x2="310" y2="352" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="195" y="300" font-size="14" fill="#495057" text-anchor="middle">細く長い＝抵抗 2倍</text>
    <text x="170" y="412" font-size="17" fill="#212529" text-anchor="middle">電圧 1・抵抗 2</text>
    <text x="170" y="440" font-size="17" fill="#1C7ED6" text-anchor="middle" font-weight="700">→ 電流 1/2（半分）</text>
  </g>
</svg>
