<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B8A3E"/>
    </marker>
    <style>
      .t { font-size: 19px; font-weight: 700; }
      .b { font-size: 16px; font-weight: 700; fill: #212529; }
      .s { font-size: 13px; fill: #495057; }
      .ln { stroke: #495057; stroke-width: 2.5; fill: none; }
      .lg { stroke: #2B8A3E; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="920" height="440" fill="#FFFFFF"/>

  <!-- open loop -->
  <rect x="16" y="14" width="888" height="170" rx="16" fill="#FFF9DB" stroke="#FFD43B" stroke-width="2"/>
  <text x="36" y="46" class="t" fill="#E67700">オープンループ（Lab D のやり方）</text>
  <rect x="60" y="72" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
  <text x="155" y="104" class="b" text-anchor="middle">命令の列</text>
  <text x="155" y="126" class="s" text-anchor="middle">あらかじめ決めておく</text>
  <line x1="252" y1="107" x2="352" y2="107" class="ln" marker-end="url(#ar)"/>
  <text x="302" y="96" class="s" text-anchor="middle">speed・angle</text>
  <rect x="356" y="72" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
  <text x="451" y="104" class="b" text-anchor="middle">車</text>
  <text x="451" y="126" class="s" text-anchor="middle">ずれ・じゃまが入る</text>
  <line x1="548" y1="107" x2="648" y2="107" class="ln" marker-end="url(#ar)"/>
  <rect x="652" y="72" width="190" height="70" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
  <text x="747" y="104" class="b" text-anchor="middle">走った結果</text>
  <text x="747" y="126" class="s" text-anchor="middle">だれも確かめない</text>
  <text x="36" y="170" class="s" fill="#495057">ずれても直せないので、ずれがそのまま積み重なる</text>

  <!-- closed loop -->
  <rect x="16" y="200" width="888" height="226" rx="16" fill="#EBFBEE" stroke="#8CE99A" stroke-width="2"/>
  <text x="36" y="232" class="t" fill="#2B8A3E">クローズドループ（フィードバック、第6章から）</text>
  <rect x="60" y="258" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
  <text x="135" y="290" class="b" text-anchor="middle">目標</text>
  <text x="135" y="312" class="s" text-anchor="middle">線の上を走りたい</text>
  <line x1="212" y1="293" x2="282" y2="293" class="ln" marker-end="url(#ar)"/>
  <rect x="286" y="258" width="180" height="70" rx="12" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2.5"/>
  <text x="376" y="290" class="b" text-anchor="middle">決める</text>
  <text x="376" y="312" class="s" text-anchor="middle">目標とのずれから命令を</text>
  <line x1="468" y1="293" x2="568" y2="293" class="ln" marker-end="url(#ar)"/>
  <text x="518" y="282" class="s" text-anchor="middle">speed・angle</text>
  <rect x="572" y="258" width="150" height="70" rx="12" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
  <text x="647" y="290" class="b" text-anchor="middle">車</text>
  <text x="647" y="312" class="s" text-anchor="middle">ずれ・じゃまが入る</text>
  <line x1="724" y1="293" x2="770" y2="293" class="ln"/>
  <path d="M770 293 L 790 293 L 790 388 L 740 388" class="lg" marker-end="url(#arg)"/>
  <rect x="560" y="356" width="176" height="60" rx="12" fill="#FFFFFF" stroke="#2B8A3E" stroke-width="2.5"/>
  <text x="648" y="384" class="b" text-anchor="middle">センサで見る</text>
  <text x="648" y="404" class="s" text-anchor="middle">カメラ・LIDAR など</text>
  <path d="M558 386 L 376 386 L 376 332" class="lg" marker-end="url(#arg)"/>
  <text x="468" y="378" class="s" text-anchor="middle" fill="#2B8A3E">今の様子を知らせる</text>
  <text x="808" y="330" class="s">毎コマ</text>
  <text x="808" y="348" class="s">くり返す</text>
</svg>
