<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="Noto Sans CJK JP, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
  <style>.h{font-size:15px;font-weight:700;fill:#495057}.b{font-size:15px;font-weight:700;fill:#212529}.s{font-size:12px;fill:#495057}.c{font-size:11.5px;font-family:"DejaVu Sans Mono",monospace;fill:#1864AB}.ln{stroke:#495057;stroke-width:2}</style></defs>
  <rect width="940" height="420" fill="#FFFFFF"/>
  <!-- lanes -->
  <rect x="12" y="14" width="916" height="120" rx="14" fill="#F8F9FA" stroke="#DEE2E6"/>
  <text x="26" y="38" class="h">車（RACECAR）</text>
  <rect x="12" y="148" width="916" height="130" rx="14" fill="#E7F5FF" stroke="#A5D8FF"/>
  <text x="236" y="172" class="h">パソコン（学習用の環境）</text>
  <rect x="12" y="292" width="916" height="116" rx="14" fill="#EBFBEE" stroke="#B2F2BB"/>
  <text x="26" y="316" class="h">パソコン（x86-64 の Linux）</text>
  <!-- boxes -->
  <rect x="40" y="50" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
  <text x="115" y="78" class="b" text-anchor="middle">① 写真を撮る</text><text x="115" y="100" class="c" text-anchor="middle">capture.py（5-12）</text>
  <rect x="40" y="186" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="2"/>
  <text x="115" y="212" class="b" text-anchor="middle">② 正解を付ける</text><text x="115" y="234" class="c" text-anchor="middle">Label Studio</text><text x="115" y="252" class="s" text-anchor="middle">（5-13）</text>
  <rect x="230" y="186" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#1C7ED6" stroke-width="2"/>
  <text x="305" y="212" class="b" text-anchor="middle">③ 分ける</text><text x="305" y="234" class="s" text-anchor="middle">学習 60%・検証 20%</text><text x="305" y="252" class="s" text-anchor="middle">・テスト 20%</text>
  <rect x="420" y="186" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#1C7ED6" stroke-width="2"/>
  <text x="495" y="212" class="b" text-anchor="middle">④ 学習する</text><text x="495" y="234" class="c" text-anchor="middle">EfficientDet-Lite0</text><text x="495" y="252" class="s" text-anchor="middle">50 周（エポック）</text>
  <rect x="600" y="186" width="176" height="80" rx="10" fill="#FFFFFF" stroke="#1C7ED6" stroke-width="2"/>
  <text x="688" y="212" class="b" text-anchor="middle">⑤ 評価・書き出し</text><text x="688" y="234" class="s" text-anchor="middle">テスト用データで AP</text><text x="688" y="252" class="c" text-anchor="middle">.tflite（整数に量子化）</text>
  <rect x="600" y="326" width="176" height="70" rx="10" fill="#FFFFFF" stroke="#2F9E44" stroke-width="2"/>
  <text x="688" y="352" class="b" text-anchor="middle">⑥ Edge TPU 用に変換</text><text x="688" y="376" class="c" text-anchor="middle">edgetpu_compiler</text>
  <rect x="800" y="50" width="116" height="70" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
  <text x="858" y="78" class="b" text-anchor="middle">⑦ 車で使う</text><text x="858" y="100" class="c" text-anchor="middle">rc.vision</text>
  <!-- arrows -->
  <line x1="115" y1="120" x2="115" y2="182" class="ln" marker-end="url(#ar)"/><text x="122" y="145" class="s">scp でコピー</text>
  <line x1="190" y1="226" x2="226" y2="226" class="ln" marker-end="url(#ar)"/>
  <line x1="380" y1="226" x2="416" y2="226" class="ln" marker-end="url(#ar)"/>
  <line x1="570" y1="226" x2="596" y2="226" class="ln" marker-end="url(#ar)"/>
  <line x1="688" y1="266" x2="688" y2="322" class="ln" marker-end="url(#ar)"/>
  <path d="M776 361 L 858 361 L 858 124" class="ln" fill="none" marker-end="url(#ar)"/><text x="866" y="300" class="s">_edgetpu</text><text x="866" y="316" class="s">.tflite と</text><text x="866" y="332" class="s">ラベルを</text><text x="866" y="348" class="s">車へ</text>
</svg>
